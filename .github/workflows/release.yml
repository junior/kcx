name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The release environment holds the secrets, and only v* tags may use it.
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub Release and its assets
      id-token: write # keyless cosign signatures and the attestations
      attestations: write
    steps:
      # The macOS binaries are signed and notarised with all five Apple secrets,
      # and released unsigned with none. Only some is a mistake, and a release
      # cannot be changed once it is out: stop here, before anything is built.
      # The step prints names, never values.
      - name: Apple secrets, all five or none
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          present=""
          missing=""
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -n "${!name}" ]; then present="$present $name"; else missing="$missing $name"; fi
          done
          if [ -z "$present" ]; then
            echo "No Apple secrets: the macOS binaries will not be signed."
          elif [ -z "$missing" ]; then
            echo "All five Apple secrets are set: the macOS binaries will be signed and notarised."
          else
            echo "::error::Only some Apple secrets are set. Set:${present}. Missing:${missing}. Set all five in the release environment, or remove them all to release unsigned."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Release notes from the CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ p = ($0 ~ ("^## " v "( |$)")) } p' CHANGELOG.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then echo "See CHANGELOG.md." > /tmp/notes.md; fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # An exact version, bumped by hand: Dependabot updates the action, not
          # the GoReleaser it downloads (whose checksums it verifies with cosign).
          version: v2.19.0
          args: release --clean --release-notes /tmp/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple code signing and notarisation of the macOS binaries: all five
          # secrets, or none, which leaves them unsigned; the release is still
          # built and attested. The first step stops a release with only some.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # The Homebrew tap follows a full release: the from-source formula in
  # junior/homebrew-tap gets this tag and its source tarball's checksum, committed
  # and pushed with HOMEBREW_TAP_TOKEN, a fine-grained token with read and write
  # access to the contents of that one repository, kept as a secret of the
  # release environment. A pre-release tag (a hyphen in its name) leaves the tap
  # alone. Without the secret this job fails and the release above stands.
  tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: junior/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the formula at this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          url="https://github.com/junior/kcx/archive/refs/tags/${TAG}.tar.gz"
          for attempt in 1 2 3 4 5 6; do
            curl -sSfL -o /tmp/src.tar.gz "$url" && break
            [ "$attempt" -lt 6 ] || { echo "no tarball at ${url}" >&2; exit 1; }
            sleep 10
          done
          sha=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)
          # The third expression moves a formula from before 2.2.0 to the version
          # stamp that 2.2.0 introduced; on a formula already there it does nothing.
          sed -i -e "s|/archive/refs/tags/v[^\"]*\.tar\.gz|/archive/refs/tags/${TAG}.tar.gz|" \
                 -e "s|sha256 \"[0-9a-f]\{64\}\"|sha256 \"${sha}\"|" \
                 -e "s|-X github.com/junior/kcx/internal/cli.version=|-X main.version=|" Formula/kcx.rb
          if git diff --quiet; then
            echo "the formula already points at ${TAG}"
            exit 0
          fi
          git config user.name "junior"
          git config user.email "junior@users.noreply.github.com"
          git commit -am "kcx ${TAG#v}"
          git push
